{{ define "main" }}
<div class="wrap page page-wide">
  <header class="page-head">
    <p class="kicker"><a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a></p>
    <h1>{{ .Title }}</h1>
    <p class="lead">{{ len .Pages }} article{{ if gt (len .Pages) 1 }}s{{ end }}</p>
  </header>
  {{ partial "article-list.html" .Pages }}
</div>
{{ end }}
