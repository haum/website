{{/* Champs d'une fiche projet (réalisation, état), pastille colorée selon l'avancement */}}
{{ if or .Params.realisation .Params.etat }}
<dl class="badges">
  {{ with .Params.realisation }}<div class="badge badge-{{ .color }}"><dt>réalisation</dt><dd>{{ .label }}</dd></div>{{ end }}
  {{ with .Params.etat }}<div class="badge badge-{{ .color }}"><dt>état</dt><dd>{{ .label }}</dd></div>{{ end }}
</dl>
{{ end }}
