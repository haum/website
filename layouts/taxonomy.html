{{ define "main" }}
<div class="sheet">
  <section class="entry">
    <aside class="margin"><p class="note">↳ <a href="/articles/">tous les articles</a></p></aside>
    <div class="text">
      <header class="page-head"><h1>{{ .Title }}</h1></header>
      <ul class="tags tags-cloud">
        {{ range .Data.Terms.Alphabetical }}
        <li><a class="chip" href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }} <small>{{ .Count }}</small></a></li>
        {{ end }}
      </ul>
    </div>
  </section>
</div>
{{ end }}
