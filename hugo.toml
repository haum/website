baseURL = "https://haum.org/"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "HAUM — Hackerspace au Mans"
timeZone = "Europe/Paris"

# Conserve les URL de l'ancien site Pelican (/slug.html, /pages/slug.html)
uglyURLs = true
disablePathToLower = true
enableRobotsTXT = true
summaryLength = 40
titleCaseStyle = "none"

# content/ est le clone du dépôt website-content (comme pour Pelican) ;
# site/ contient les quelques pages techniques propres au moteur.
[module]
  [module.hugoVersion]
    min = "0.156.0"
  [[module.mounts]]
    source = "content"
    target = "content"
    files = ["! images/**", "! calendar/**", "! README*"]
  [[module.mounts]]
    source = "site"
    target = "content"
  [[module.mounts]]
    source = "content/images"
    target = "static/images"
    files = ["! accueil/**"]
  # Photos d'accueil : traitées par Hugo (réduites si trop grandes)
  [[module.mounts]]
    source = "content/images/accueil"
    target = "assets/accueil"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

[permalinks.page]
  articles = "/:slug"
  pages = "/pages/:slug"

[permalinks.section]
  articles = "/articles"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

[pagination]
  pagerSize = 12

[markup.goldmark.renderer]
  # Le contenu migré contient du HTML (images dimensionnées, blocs alignés…)
  unsafe = true
[markup.goldmark.extensions.typographer]
  leftDoubleQuote = "&laquo;&nbsp;"
  rightDoubleQuote = "&nbsp;&raquo;"
[markup.highlight]
  noClasses = false
  style = "monokai"

[outputs]
  home = ["html", "rss", "llms"]
  section = ["html", "rss"]

# /llms.txt : plan du site lisible par les modèles de langage (llmstxt.org)
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputFormats.calendar]
  mediaType = "text/calendar"
  baseName = "calendar"
  isPlainText = true
  protocol = "webcal://"

[params]
  description = "Le Hackerspace Au Mans (HAUM) est une association sarthoise adepte du Do-It-Yourself : électronique, informatique, fabrication, partage de savoirs."
  editURL = "https://github.com/haum/website-content/edit/master/"
  newArticleURL = "https://github.com/haum/website-content/new/master/articles"
  # Texte d'un bandeau d'avertissement en haut de chaque page ; s'il est
  # défini, les pages passent aussi en noindex. Vide par défaut.
  preview = ""
  spaceStatusURL = "/spacestatus"
  # Page d'adhésion (adresse stable de l'association ; on peut y mettre
  # la campagne de l'année, ex. ".../adhesions/nous-rejoindre-2026")
  adhesion = "https://www.helloasso.com/associations/haum"
  # Salon Matrix public du HAUM, ex. "https://matrix.to/#/#haum:exemple.org"
  # (vide = lien masqué partout sur le site)
  matrix = "https://matrix.to/#/#haum:matrix.org"
  mastodon = { instance = "piaille.fr", account = "haum" }
  address = ["2ème étage", "57 boulevard Demorieux", "72100 Le Mans"]
  osm = "https://www.openstreetmap.org/?mlat=47.99352&mlon=0.18522#map=17/47.99352/0.18522"
  taglines = [
    "Convergence de bidouilleurs en centre ville",
    "Rassemblement de bidouilleurs, de bricodeurs et de bricoleurs",
    "Hackers vaillants, rien d'impossible",
    "Toujours hacker un peu plus loin",
    "Modifier pour faire sien",
  ]

